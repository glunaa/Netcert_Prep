<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NetCertPrep</title>
  <script>
    // SPA redirect for GitHub Pages — github.com/rafgraph/spa-github-pages
    // Keep 1 path segment (/Netcert_Prep/) and encode the rest as a query param
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
