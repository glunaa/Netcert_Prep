const NETPLUS_QS = [
{id:1,domain:“Networking Concepts”,q:“A packet is traveling from a host to a remote network. At which OSI layer does the router make its forwarding decision?”,opts:[“Layer 2 — Data Link”,“Layer 3 — Network”,“Layer 4 — Transport”,“Layer 7 — Application”],answer:1,exp:“Routers operate at Layer 3 (Network) and forward packets based on IP addresses and routing tables.”},
{id:2,domain:“Networking Concepts”,q:“Which protocol does traceroute/tracert use to discover the path to a destination?”,opts:[“TCP”,“UDP”,“ICMP”,“ARP”],answer:2,exp:“Traceroute uses ICMP Echo (or UDP on Linux) with incrementing TTL values. Each hop decrements TTL; when TTL=0 the router sends ICMP Time Exceeded back.”},
{id:3,domain:“Networking Concepts”,q:“A technician needs to allow encrypted web traffic through a firewall. Which port must be permitted?”,opts:[“Port 80”,“Port 22”,“Port 443”,“Port 8080”],answer:2,exp:“HTTPS (HTTP over TLS) uses TCP port 443. Port 80 is plain HTTP, 22 is SSH, 8080 is HTTP alternate.”},
{id:4,domain:“Networking Concepts”,q:“Which traffic type sends a single stream to multiple specific receivers using Class D IP addresses?”,opts:[“Unicast”,“Broadcast”,“Multicast”,“Anycast”],answer:2,exp:“Multicast sends to a group of interested receivers using Class D addresses (224.0.0.0–239.255.255.255). Broadcast goes to all on segment.”},
{id:5,domain:“Networking Concepts”,q:“What is the usable host range for the subnet 192.168.10.64/26?”,opts:[“192.168.10.64 – 192.168.10.127”,“192.168.10.65 – 192.168.10.126”,“192.168.10.65 – 192.168.10.127”,“192.168.10.64 – 192.168.10.126”],answer:1,exp:”/26 = 64 IPs. Network = .64, Broadcast = .127. Usable hosts = .65 – .126 (62 hosts).”},
{id:6,domain:“Networking Concepts”,q:“Which IPv4 address range is automatically assigned by a host when a DHCP server cannot be reached?”,opts:[“192.168.0.0/16”,“10.0.0.0/8”,“169.254.0.0/16”,“172.16.0.0/12”],answer:2,exp:“APIPA (Automatic Private IP Addressing) uses 169.254.0.0/16. A host self-assigns when DHCP fails — only communicates with other APIPA hosts on same segment.”},
{id:7,domain:“Networking Concepts”,q:“Which IPSec component provides data encryption AND authentication for the IP payload?”,opts:[“AH (Authentication Header)”,“ESP (Encapsulating Security Payload)”,“IKE (Internet Key Exchange)”,“GRE (Generic Routing Encapsulation)”],answer:1,exp:“ESP provides both encryption and authentication of the payload. AH provides authentication only (no encryption). IKE negotiates keys. GRE is a separate tunneling protocol.”},
{id:8,domain:“Networking Concepts”,q:“A company’s VoIP traffic is being prioritized over data traffic on the network. Which networking function enables this?”,opts:[“VLAN”,“NAT”,“QoS”,“STP”],answer:2,exp:“QoS (Quality of Service) classifies and prioritizes traffic. Voice traffic is given higher priority to reduce jitter and latency, which degrade call quality.”},
{id:9,domain:“Network Implementation”,q:“A network administrator needs to divide one physical router interface to route traffic for three VLANs. What should be configured?”,opts:[“Three separate physical interfaces”,“Subinterfaces (router-on-a-stick)”,“Three separate routers”,“A Layer 2 switch”],answer:1,exp:“Router-on-a-stick uses subinterfaces (e.g., Gi0/0.10, Gi0/0.20) each configured with an IP and 802.1Q tag for each VLAN — requires a trunk port on the connected switch.”},
{id:10,domain:“Network Implementation”,q:“A switch port connected to an end-user PC keeps going into err-disabled state. What is the MOST likely cause?”,opts:[“The port is a trunk port”,“BPDU Guard is enabled and the PC is sending BPDUs”,“The VLAN doesn’t exist”,“The port speed is mismatched”],answer:1,exp:“BPDU Guard disables PortFast-enabled ports that receive BPDUs. A rogue switch (or misconfigured device) sending BPDUs would trigger this. Investigate what’s connected to that port.”},
{id:11,domain:“Network Implementation”,q:“Which routing protocol uses autonomous system (AS) numbers and is the protocol of the internet backbone?”,opts:[“OSPF”,“EIGRP”,“RIP”,“BGP”],answer:3,exp:“BGP (Border Gateway Protocol) is the path-vector protocol used between ISPs and autonomous systems on the internet. It uses AS numbers for routing policy and is the only EGP (Exterior Gateway Protocol) still in use.”},
{id:12,domain:“Network Implementation”,q:“A switch has multiple physical links to another switch for redundancy. After enabling STP, only one link is forwarding. What would provide both redundancy AND load balancing across all links?”,opts:[“RSTP”,“BPDU Guard”,“Link Aggregation (LACP)”,“PortFast”],answer:2,exp:“Link Aggregation (LACP / 802.3ad) bundles multiple physical links into one logical link — all links forward traffic AND provide redundancy. STP blocks redundant links; LACP treats them as one logical channel.”},
{id:13,domain:“Network Implementation”,q:“A wireless client is connecting to the correct SSID but keeps getting DHCP from the wrong subnet. What is the MOST likely cause?”,opts:[“Wrong DNS server”,“The AP is configured for the wrong VLAN”,“Incorrect WPA2 passphrase”,“Duplex mismatch on AP uplink”],answer:1,exp:“If the AP’s port or WLAN is mapped to the wrong VLAN, DHCP requests go to the wrong DHCP scope and the client gets an IP from the wrong subnet.”},
{id:14,domain:“Network Implementation”,q:“Which wireless standard ONLY operates on the 5 GHz band and introduced MU-MIMO beamforming?”,opts:[“802.11n”,“802.11g”,“802.11ac”,“802.11ax”],answer:2,exp:“802.11ac (Wi-Fi 5) operates exclusively on 5 GHz and introduced MU-MIMO (serve multiple clients simultaneously) and beamforming. 802.11n (Wi-Fi 4) is dual-band.”},
{id:15,domain:“Network Implementation”,q:“After a DHCP server failure, a new DHCP server is installed on a different subnet. Clients are still not receiving IP addresses. What is required?”,opts:[“Reconfigure all client NICs”,“Enable NAT on the router”,“Configure a DHCP relay (IP helper address) on the router”,“Restart all switches”],answer:2,exp:“DHCP uses broadcasts which don’t cross router boundaries. The router’s interface needs an IP helper address (ip helper-address) to forward DHCP broadcasts to the remote DHCP server.”},
{id:16,domain:“Network Operations”,q:“A DNS record returns a different hostname instead of an IP address. Which record type was queried?”,opts:[“A”,“PTR”,“MX”,“CNAME”],answer:1,exp:“CNAME (Canonical Name) maps an alias to another hostname, not directly to an IP. For example, www.example.com → example.com. The resolver then looks up the A record for the canonical name.”},
{id:17,domain:“Network Operations”,q:“A security audit requires knowing the maximum data loss acceptable if a disaster occurs. Which metric defines this?”,opts:[“RTO”,“MTTR”,“MTBF”,“RPO”],answer:3,exp:“RPO (Recovery Point Objective) defines the maximum acceptable data loss measured in time — effectively how old can the restored data be. Lower RPO = more frequent backups required.”},
{id:18,domain:“Network Operations”,q:“Which SNMP version is required for secure, encrypted network monitoring in a production environment?”,opts:[“SNMPv1”,“SNMPv2”,“SNMPv2c”,“SNMPv3”],answer:3,exp:“SNMPv3 adds authentication (MD5/SHA) and encryption (AES/DES). v1 and v2c use community strings in plaintext — easily intercepted. Always use v3 in production.”},
{id:19,domain:“Network Operations”,q:“A company’s critical systems must be restored within 4 hours of a disaster. Which metric is this?”,opts:[“RPO”,“MTBF”,“RTO”,“MTTR”],answer:2,exp:“RTO (Recovery Time Objective) defines the maximum acceptable downtime — how quickly systems must be restored. An RTO of 4 hours means systems must be online within 4 hours of an outage.”},
{id:20,domain:“Network Operations”,q:“An administrator needs to access an internal server securely from a remote location. The only externally accessible system is a hardened Linux server that proxies all admin connections. What is this called?”,opts:[“DMZ”,“VPN concentrator”,“Jump box / Bastion host”,“Proxy server”],answer:2,exp:“A jump box (bastion host) is a hardened server that acts as the single access point for administrative connections to internal systems. All admin sessions go through it, creating a centralized, auditable chokepoint.”},
{id:21,domain:“Network Security”,q:“An attacker connects a laptop to a switch port and sends thousands of frames with randomized source MAC addresses. What is the BEST defense?”,opts:[“DHCP snooping”,“Dynamic ARP Inspection”,“Port security with a maximum MAC count”,“VLAN segmentation”],answer:2,exp:“Port security limits the number of MAC addresses on a port and can shut down the port (err-disable) or drop frames when exceeded. This directly prevents MAC flooding attacks.”},
{id:22,domain:“Network Security”,q:“A company wants to ensure wireless clients authenticate with unique credentials rather than a shared password. Which solution achieves this?”,opts:[“WPA2-Personal (PSK)”,“WEP”,“WPA2-Enterprise with 802.1X and RADIUS”,“Hidden SSID”],answer:2,exp:“WPA2-Enterprise uses 802.1X with a RADIUS server for per-user authentication. Each user has unique credentials — a compromised password only affects one user, unlike a shared PSK.”},
{id:23,domain:“Network Security”,q:“Which protocol at Layer 2 can prevent rogue DHCP servers from issuing incorrect IP configuration to clients?”,opts:[“802.1X”,“DHCP snooping”,“Dynamic ARP Inspection”,“Port security”],answer:1,exp:“DHCP Snooping marks switch ports as trusted (uplinks to real DHCP servers) or untrusted (client ports). DHCP offers from untrusted ports are dropped — blocking rogue DHCP servers.”},
{id:24,domain:“Network Security”,q:“An attacker creates an access point with the same SSID as the corporate network near the office entrance. Users connect to it instead of the real AP. What type of attack is this?”,opts:[“Rogue AP”,“MAC flooding”,“Evil twin”,“Deauthentication”],answer:2,exp:“An Evil Twin is a rogue AP with the same SSID as the legitimate network, placed to lure users into connecting. The attacker can then perform MITM or credential harvesting. Rogue APs are unauthorized APs but aren’t necessarily impersonating the real network.”},
{id:25,domain:“Network Security”,q:“Which security zone typically contains publicly accessible servers like web servers and email servers, separated from both the internet and the internal network?”,opts:[“VLAN 1”,“Trusted zone”,“Screened subnet (DMZ)”,“Management VLAN”],answer:2,exp:“A screened subnet (DMZ) sits between the untrusted internet and the trusted internal network. Public-facing servers go here. A compromise of a DMZ server doesn’t directly expose the internal network.”},
{id:26,domain:“Network Troubleshooting”,q:“A user can browse internal websites by IP but cannot reach any website by name. Other users are unaffected. What is the FIRST thing to check?”,opts:[“The user’s default gateway”,“The user’s DNS server setting”,“The switch port configuration”,“The user’s subnet mask”],answer:1,exp:“Symptoms: IP works, names don’t, only one user affected. DNS server misconfiguration on the client is the most likely cause. Check ipconfig /all to verify DNS server setting. Then test with nslookup.”},
{id:27,domain:“Network Troubleshooting”,q:“A network switch is showing a large number of giants on an interface connecting to a storage array. What is the MOST likely cause?”,opts:[“A duplex mismatch”,“The storage array is sending jumbo frames but the switch port doesn’t support them”,“ARP poisoning attack”,“A bad cable”],answer:1,exp:“Giants are frames larger than 1518 bytes. If the storage array sends 9000-byte jumbo frames but the switch port MTU is 1500, the switch sees them as giants. Enable jumbo frames or match the MTU on both sides.”},
{id:28,domain:“Network Troubleshooting”,q:“After installing a new switch, half the network segment loses connectivity. What is the MOST likely cause?”,opts:[“The switch was configured with wrong VLANs”,“A switching loop formed because STP hasn’t converged or is disabled”,“The switch has incorrect duplex settings”,“DHCP exhausted the address pool”],answer:1,exp:“A switching loop causes a broadcast storm — traffic circulates endlessly, consuming all bandwidth. STP prevents this by blocking redundant paths. If STP is disabled or misconfigured on the new switch, a loop can form.”},
{id:29,domain:“Network Troubleshooting”,q:“A technician uses a tone generator on a cable and traces it with a probe to identify it at the patch panel. What is this tool called?”,opts:[“OTDR”,“Cable certifier”,“Fox and hound / Toner probe”,“Multimeter”],answer:2,exp:“A fox and hound (toner probe) kit uses a tone generator at one end and an inductive probe at the other to trace cables through walls, ceilings, and patch panels without cutting or disconnecting anything.”},
{id:30,domain:“Network Troubleshooting”,q:“An interface shows input errors and CRC errors but the cable has been replaced. The switch still reports errors. What should the technician check next?”,opts:[“Replace the switch”,“Check for duplex mismatch between the switch and connected device”,“Reconfigure the VLAN”,“Update the firmware”],answer:1,exp:“If cable replacement didn’t fix CRC/input errors, duplex mismatch is the next most likely cause. One side set to full-duplex and the other to half-duplex causes late collisions and CRC errors. Set both sides to the same duplex (preferably auto-negotiate).”},
];

const AWS_QS = [
{id:1,domain:“Cloud Concepts”,q:“A company wants to host an application on AWS and needs the infrastructure to automatically scale down during off-peak hours to reduce costs. Which cloud characteristic enables this?”,opts:[“High availability”,“Fault tolerance”,“Elasticity”,“Durability”],answer:2,exp:“Elasticity allows resources to automatically scale up OR down based on demand. This directly enables cost savings during off-peak hours by releasing unneeded resources.”},
{id:2,domain:“Cloud Concepts”,q:“Under the AWS Shared Responsibility Model, who is responsible for patching the guest operating system on an Amazon EC2 instance?”,opts:[“AWS only”,“The customer only”,“Both AWS and the customer”,“Neither — it’s automatic”],answer:1,exp:“EC2 is IaaS. AWS manages the hypervisor and physical infrastructure. The customer manages the guest OS, including patching, security hardening, and application configuration.”},
{id:3,domain:“Cloud Concepts”,q:“A company currently owns physical servers (capital expense). Which cloud benefit describes shifting to AWS’s pay-as-you-go model?”,opts:[“Eliminating all IT costs”,“Trading CapEx for OpEx”,“Achieving 100% uptime”,“Reducing network latency”],answer:1,exp:“One of the 6 cloud advantages: trading upfront capital expenditure (buying hardware) for operational expenditure (paying only for what you consume). Improves cash flow and aligns costs with actual usage.”},
{id:4,domain:“Cloud Concepts”,q:“Which AWS Well-Architected Framework pillar focuses on the ability to recover from infrastructure or service disruptions?”,opts:[“Performance Efficiency”,“Cost Optimization”,“Reliability”,“Operational Excellence”],answer:2,exp:“The Reliability pillar focuses on recovering from failures and meeting demand. It includes multi-AZ deployments, backups, distributed system design, and testing recovery procedures.”},
{id:5,domain:“Cloud Concepts”,q:“A large enterprise is planning an AWS migration and wants to understand the organizational and cultural changes required. Which AWS CAF perspective addresses this?”,opts:[“Platform”,“Security”,“People”,“Governance”],answer:2,exp:“The People perspective of the CAF focuses on organizational change management, skills gaps, culture, and staffing — the human side of cloud adoption.”},
{id:6,domain:“Cloud Concepts”,q:“A company wants to move an application to AWS with minimal changes to the application code or architecture. Which migration strategy is this?”,opts:[“Refactor”,“Replatform”,“Repurchase”,“Rehost”],answer:3,exp:“Rehost (Lift & Shift) moves the application to cloud infrastructure with no code changes. It’s the fastest migration strategy. Replatform makes minor optimizations. Refactor re-architects for cloud-native.”},
{id:7,domain:“Cloud Concepts”,q:“Which AWS infrastructure component ensures applications remain available even if one or more data centers within a geographic area fail?”,opts:[“Edge Locations”,“AWS Regions”,“Availability Zones”,“Virtual Private Clouds”],answer:2,exp:“Availability Zones are physically separate data centers within a Region, each with independent power, cooling, and networking. Deploying across multiple AZs provides fault tolerance if one AZ fails.”},
{id:8,domain:“Cloud Concepts”,q:“Amazon Elastic Beanstalk is an example of which cloud service model?”,opts:[“IaaS”,“PaaS”,“SaaS”,“FaaS”],answer:1,exp:“Elastic Beanstalk is PaaS — you deploy your application code and AWS manages the underlying EC2, ELB, Auto Scaling, and monitoring. You control the application, AWS handles the platform.”},
{id:9,domain:“Security & Compliance”,q:“A developer needs an EC2 instance to access DynamoDB without storing AWS credentials in the application code. What is the BEST solution?”,opts:[“Store access keys in environment variables”,“Create an IAM Role and attach it to the EC2 instance”,“Use the root account credentials”,“Create an IAM User and embed the access key”],answer:1,exp:“IAM Roles provide temporary, automatically rotating credentials to EC2. The instance assumes the role and gets temporary credentials via the Instance Metadata Service. Never embed long-term credentials in code or on instances.”},
{id:10,domain:“Security & Compliance”,q:“A company must demonstrate to auditors that no unauthorized changes were made to their AWS resources over the past year. Which service provides this evidence?”,opts:[“Amazon CloudWatch”,“AWS Config”,“AWS CloudTrail”,“AWS Trusted Advisor”],answer:2,exp:“AWS CloudTrail logs every API call — who made it, when, from which IP, and the result. It provides a complete audit trail of all account activity. Enable CloudTrail in all regions and store logs in S3 for long-term retention.”},
{id:11,domain:“Security & Compliance”,q:“Which AWS service analyzes VPC Flow Logs, CloudTrail events, and DNS logs using machine learning to detect threats without requiring agents?”,opts:[“AWS Inspector”,“Amazon Macie”,“Amazon GuardDuty”,“AWS Security Hub”],answer:2,exp:“Amazon GuardDuty is a managed threat detection service that uses ML and threat intelligence to analyze CloudTrail, VPC Flow Logs, and DNS logs. No agents or infrastructure to manage. 30-day free trial.”},
{id:12,domain:“Security & Compliance”,q:“A financial services company needs to access AWS SOC 2 compliance reports for their auditors. Which service provides this?”,opts:[“AWS Trusted Advisor”,“AWS Config”,“AWS Artifact”,“AWS Inspector”],answer:2,exp:“AWS Artifact is a self-service portal providing on-demand access to AWS compliance reports (SOC 1/2/3, PCI DSS, ISO 27001, FedRAMP, HIPAA BAA) and AWS agreements.”},
{id:13,domain:“Security & Compliance”,q:“An S3 bucket containing customer PII was accidentally made public. Which service would have proactively detected and alerted on this sensitive data exposure?”,opts:[“AWS GuardDuty”,“Amazon Inspector”,“Amazon Macie”,“AWS Config”],answer:2,exp:“Amazon Macie uses ML to automatically discover, classify, and protect sensitive data (PII, financial data) in S3 and alerts when data is over-exposed or publicly accessible.”},
{id:14,domain:“Security & Compliance”,q:“A company wants automatic DDoS protection for their AWS workloads at no additional cost. Which service provides this?”,opts:[“AWS WAF”,“AWS Shield Advanced”,“AWS Shield Standard”,“Amazon GuardDuty”],answer:2,exp:“AWS Shield Standard is automatically applied to all AWS customers at no cost. It protects against common Layer 3 and 4 DDoS attacks. Shield Advanced (paid) adds Layer 7 protection and 24/7 DRT access.”},
{id:15,domain:“Security & Compliance”,q:“Which IAM best practice should be applied immediately after creating a new AWS account?”,opts:[“Create multiple root accounts”,“Enable MFA on the root account”,“Share root credentials with the admin team”,“Disable root account”],answer:1,exp:“The root account has unrestricted access and cannot be restricted by IAM policies. Enable MFA immediately, then create an IAM admin user for daily tasks. Never use root for daily operations and never share root credentials.”},
{id:16,domain:“Core Services”,q:“A company needs to run a containerized application without managing the underlying servers. Which AWS service provides serverless container execution?”,opts:[“Amazon ECS with EC2 launch type”,“Amazon EC2”,“AWS Fargate”,“Amazon EKS with self-managed nodes”],answer:2,exp:“AWS Fargate is a serverless compute engine for containers. You define CPU/memory for your task and Fargate handles all server provisioning, patching, and management. Works with both ECS and EKS.”},
{id:17,domain:“Core Services”,q:“A company stores millions of objects in S3 with unpredictable access patterns — some objects are accessed daily, others not for months. Which S3 storage class automatically optimizes costs?”,opts:[“S3 Standard”,“S3 Standard-IA”,“S3 Intelligent-Tiering”,“S3 Glacier”],answer:2,exp:“S3 Intelligent-Tiering automatically moves objects between access tiers (Frequent, Infrequent, Archive) based on actual access patterns. No retrieval fees, just a small monitoring fee per object.”},
{id:18,domain:“Core Services”,q:“A read-heavy web application is experiencing high database latency. The data is relatively static and queried thousands of times per second. What is the BEST solution?”,opts:[“Scale up the RDS instance”,“Enable Multi-AZ on RDS”,“Add an ElastiCache layer in front of RDS”,“Migrate to DynamoDB”],answer:2,exp:“ElastiCache (Redis or Memcached) provides sub-millisecond in-memory caching. Frequently read, rarely changed data is cached — subsequent requests are served from cache, not the DB, reducing latency and DB load.”},
{id:19,domain:“Core Services”,q:“A company needs to decouple two microservices so that if one goes down, messages are not lost and the receiving service processes them when it recovers. Which service should they use?”,opts:[“Amazon SNS”,“Amazon SQS”,“Amazon EventBridge”,“AWS Step Functions”],answer:1,exp:“SQS (Simple Queue Service) is a message queue that decouples services. Messages persist in the queue until processed. If the consumer is down, messages wait — no loss. SNS is pub/sub (push), not a queue.”},
{id:20,domain:“Core Services”,q:“Which AWS load balancer type supports routing HTTP/HTTPS requests based on URL path (e.g., /api vs /images)?”,opts:[“Network Load Balancer”,“Gateway Load Balancer”,“Classic Load Balancer”,“Application Load Balancer”],answer:3,exp:“ALB (Application Load Balancer) operates at Layer 7 and supports path-based routing, host-based routing, and HTTP header routing. NLB operates at Layer 4 for extreme performance.”},
{id:21,domain:“Core Services”,q:“A company is running MySQL on-premises and wants to migrate to a fully managed AWS service with minimal downtime and no code changes. Which service pair is BEST?”,opts:[“DynamoDB + Snowball”,“Aurora MySQL + AWS DMS”,“RDS for MySQL + CloudFormation”,“Redshift + Data Pipeline”],answer:1,exp:“Aurora MySQL is fully compatible with MySQL — no code changes. AWS DMS (Database Migration Service) migrates the data with minimal downtime using continuous replication. Aurora then takes over as the managed target.”},
{id:22,domain:“Core Services”,q:“A company needs to connect their on-premises data center to AWS with a consistent, high-bandwidth, private connection — not over the public internet. Which service provides this?”,opts:[“AWS Site-to-Site VPN”,“AWS Direct Connect”,“Amazon CloudFront”,“AWS Transit Gateway”],answer:1,exp:“AWS Direct Connect provides a dedicated physical network connection from your data center to AWS. It bypasses the internet, offering consistent bandwidth, lower latency, and potentially lower data transfer costs for high-volume workloads.”},
{id:23,domain:“Core Services”,q:“A company wants to send automated notifications via email and SMS when an alarm is triggered. Which service should they use?”,opts:[“Amazon SQS”,“AWS Lambda”,“Amazon SNS”,“Amazon SES”],answer:2,exp:“Amazon SNS (Simple Notification Service) is a pub/sub messaging service that can push notifications to email, SMS, HTTP, Lambda, and SQS. CloudWatch Alarms commonly trigger SNS topics to send alerts.”},
{id:24,domain:“Core Services”,q:“Which AWS service allows you to define your AWS infrastructure using code templates (JSON/YAML) and provision it repeatedly and consistently?”,opts:[“AWS Systems Manager”,“AWS CodeDeploy”,“AWS CloudFormation”,“AWS Config”],answer:2,exp:“AWS CloudFormation is an IaC service — you define your stack in a template and CloudFormation provisions and updates resources. Enables repeatable, version-controlled infrastructure deployments.”},
{id:25,domain:“Core Services”,q:“A company needs to transfer 80 TB of data to AWS from a location with limited internet bandwidth. What is the MOST cost-effective and fastest solution?”,opts:[“Upload directly to S3 over the internet”,“Use AWS Direct Connect”,“Order an AWS Snowball Edge device”,“Use AWS Transfer Family”],answer:2,exp:“AWS Snowball Edge is a physical device shipped to your location. You load data locally and ship it back to AWS — avoiding internet transfer entirely. For 80 TB, this is far faster and cheaper than internet upload.”},
{id:26,domain:“Billing & Pricing”,q:“A company committed to spending $0.20/hour on compute for the next 3 years and wants the flexibility to change instance types or switch between EC2 and Fargate. Which pricing option is BEST?”,opts:[“EC2 Reserved Instances”,“EC2 Spot Instances”,“Compute Savings Plans”,“On-Demand Instances”],answer:2,exp:“Compute Savings Plans offer the most flexibility — the discount applies to any EC2 instance type, size, OS, region, and also to Lambda and Fargate. You commit to a $/hour spend, not specific resources.”},
{id:27,domain:“Billing & Pricing”,q:“A company has 10 AWS accounts for different departments. They want a single bill and to share Reserved Instance discounts across all accounts. What should they configure?”,opts:[“One large EC2 instance for all”,“AWS Organizations with consolidated billing”,“IAM cross-account roles”,“AWS Config aggregator”],answer:1,exp:“AWS Organizations with consolidated billing combines all accounts into one bill. Reserved Instance and Savings Plan discounts can be shared across the organization. Volume discounts apply to aggregate usage.”},
{id:28,domain:“Billing & Pricing”,q:“A startup wants to receive an alert when their AWS costs exceed $500 in a month so they can investigate. Which tool should they use?”,opts:[“AWS Cost Explorer”,“AWS Trusted Advisor”,“AWS Budgets”,“AWS Pricing Calculator”],answer:2,exp:“AWS Budgets lets you set custom cost or usage thresholds and sends alerts (email/SNS) when you approach or exceed them. Cost Explorer analyzes historical spend but doesn’t send alerts.”},
{id:29,domain:“Billing & Pricing”,q:“A company needs 24/7 phone access to AWS Cloud Support Engineers for a production workload. What is the MINIMUM support plan required?”,opts:[“Basic”,“Developer”,“Business”,“Enterprise”],answer:2,exp:“Business support ($100/mo minimum) provides 24/7 phone, chat, and email support, access to all Trusted Advisor checks, and <1 hour response for production system down. Developer only provides email during business hours.”},
{id:30,domain:“Billing & Pricing”,q:“Which EC2 purchasing option provides the deepest discount for a 3-year commitment on a steady-state production workload, with all cost paid upfront?”,opts:[“Spot Instances”,“On-Demand”,“Savings Plans”,“Reserved Instances — All Upfront, 3 year”],answer:3,exp:“Reserved Instances with All Upfront payment and a 3-year term provide the maximum discount (up to 72% off On-Demand). Best for steady, predictable workloads where you can commit to a specific instance type and region.”},
];

// ─── EXAM COMPONENT ─────────────────────────────────────────
function ExamResults({questions,answers,onRetry}){
const score=questions.filter(q=>answers[q.id]===q.answer).length;
const pct=Math.round((score/questions.length)*100);
const grade=pct>=90?“A”:pct>=80?“B”:pct>=70?“C”:pct>=60?“D”:“F”;
const passed=pct>=70;
const gc=pct>=80?”#3fb950”:pct>=70?”#d29922”:”#f85149”;
const feedback=pct>=90?“Excellent! You have a strong command of the material. You’re well-prepared for the real exam.”
:pct>=80?“Great work! Solid understanding across most domains. Review any weak spots and you’re exam-ready.”
:pct>=70?“Passing score, but there’s room to improve. Revisit weak domains before the real exam.”
:pct>=60?“Close to passing. Spend focused time on your lowest-scoring domains then retake.”
:“Need more study. Work through the study guides for each domain and retake when ready.”;
const domains=[…new Set(questions.map(q=>q.domain))];
const ds=domains.map(d=>{const dqs=questions.filter(q=>q.domain===d);const c=dqs.filter(q=>answers[q.id]===q.answer).length;return{d,c,t:dqs.length,p:Math.round(c/dqs.length*100)};});
return(
<div style={{maxWidth:660,margin:“0 auto”}}>
<div style={{textAlign:“center”,padding:“28px 20px”,background:”#161b22”,borderRadius:12,border:“1px solid #21262d”,marginBottom:24}}>
<div style={{fontSize:56,marginBottom:8}}>{passed?“🎉”:“📚”}</div>
<div style={{display:“flex”,alignItems:“baseline”,justifyContent:“center”,gap:14,marginBottom:6}}>
<span style={{fontSize:64,fontWeight:900,color:gc,fontFamily:”‘IBM Plex Mono’,monospace”}}>{pct}%</span>
<span style={{fontSize:36,fontWeight:700,color:gc,opacity:.7}}>({grade})</span>
</div>
<div style={{fontSize:14,color:”#8b949e”,marginBottom:8}}>{score} / {questions.length} correct</div>
<div style={{display:“inline-block”,padding:“6px 18px”,borderRadius:20,background:passed?“rgba(46,160,67,0.15)”:“rgba(248,81,73,0.15)”,border:`1px solid ${passed?"#3fb950":"#f85149"}`,color:passed?”#3fb950”:”#f85149”,fontSize:13,fontWeight:700,marginBottom:16}}>{passed?“✓ PASS”:“✗ BELOW PASSING (70%)”}</div>
<p style={{color:”#8b949e”,fontSize:13,lineHeight:1.7,maxWidth:460,margin:“0 auto”}}>{feedback}</p>
</div>
<div style={{marginBottom:24}}>
<div className="section-title">Domain Breakdown</div>
{ds.map(({d,c,t,p})=>(
<div key={d} style={{marginBottom:10}}>
<div style={{display:“flex”,justifyContent:“space-between”,marginBottom:4}}>
<span style={{fontSize:13,color:”#c9d1d9”}}>{d}</span>
<span style={{fontSize:13,color:p>=70?”#3fb950”:”#f85149”,fontWeight:700,fontFamily:”‘IBM Plex Mono’,monospace”}}>{c}/{t} ({p}%)</span>
</div>
<div style={{height:5,background:”#21262d”,borderRadius:3,overflow:“hidden”}}>
<div style={{height:“100%”,width:`${p}%`,background:p>=70?”#3fb950”:”#f85149”,borderRadius:3,transition:“width .6s ease”}}/>
</div>
</div>
))}
</div>
<div style={{textAlign:“center”,marginBottom:28}}>
<button onClick={onRetry} style={{padding:“12px 32px”,background:”#238636”,border:“none”,borderRadius:8,color:”#fff”,fontWeight:700,fontSize:14,cursor:“pointer”}}>Retake Exam →</button>
</div>
<div className="section-title">Question Review</div>
{questions.map(q=>{
const c=answers[q.id]===q.answer;
return(
<div key={q.id} style={{marginBottom:10,padding:“14px 16px”,background:”#0d1117”,border:`1px solid ${c?"#2ea04330":"#f8514930"}`,borderRadius:10,borderLeft:`3px solid ${c?"#3fb950":"#f85149"}`}}>
<div style={{fontSize:12,color:c?”#3fb950”:”#f85149”,fontWeight:700,marginBottom:4}}>{c?“✓ Correct”:“✗ Incorrect”}</div>
<div style={{fontSize:13,color:”#e6edf3”,marginBottom:4,lineHeight:1.5}}>{q.q}</div>
{!c&&<div style={{fontSize:12,color:”#8b949e”,marginBottom:4}}>Your answer: <span style={{color:”#f85149”}}>{q.opts[answers[q.id]]??“Not answered”}</span> · Correct: <span style={{color:”#3fb950”}}>{q.opts[q.answer]}</span></div>}
<div style={{fontSize:12,color:”#6e7681”,lineHeight:1.6}}>{q.exp}</div>
</div>
);
})}
</div>
);
}

function PracticeExam({questions}){
const [cur,setCur]=useState(0);
const [ans,setAns]=useState({});
const [done,setDone]=useState(false);
const q=questions[cur];
const answered=ans[q.id]!==undefined;
const correct=ans[q.id]===q.answer;
if(done) return <ExamResults questions={questions} answers={ans} onRetry={()=>{setAns({});setCur(0);setDone(false);}}/>;
return(
<div style={{maxWidth:660,margin:“0 auto”}}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:6}}>
<div style={{fontSize:12,color:”#6e7681”}}>Q{cur+1} of {questions.length}</div>
<div style={{fontSize:12,color:”#6e7681”}}>{Object.keys(ans).length} answered</div>
</div>
<div style={{height:3,background:”#21262d”,borderRadius:2,marginBottom:20,overflow:“hidden”}}>
<div style={{height:“100%”,width:`${((cur+1)/questions.length)*100}%`,background:“linear-gradient(90deg,#1f6feb,#388bfd)”,borderRadius:2,transition:“width .3s”}}/>
</div>
<div style={{fontSize:11,color:”#6e7681”,letterSpacing:1,marginBottom:6,textTransform:“uppercase”}}>{q.domain}</div>
<div style={{fontSize:15,color:”#e6edf3”,lineHeight:1.7,marginBottom:20,padding:18,background:”#161b22”,borderRadius:10,border:“1px solid #21262d”}}>{q.q}</div>
{q.opts.map((o,i)=>{
let bg=”#161b22”,border=“1px solid #21262d”,color=”#c9d1d9”;
if(answered){if(i===q.answer){bg=“rgba(46,160,67,0.12)”;border=“1px solid #2ea043”;color=”#3fb950”;}else if(i===ans[q.id]){bg=“rgba(248,81,73,0.1)”;border=“1px solid #f85149”;color=”#f85149”;}}
return <button key={i} onClick={()=>!answered&&setAns({…ans,[q.id]:i})} style={{width:“100%”,textAlign:“left”,padding:“13px 16px”,marginBottom:8,background:bg,border,borderRadius:8,color,cursor:answered?“default”:“pointer”,fontSize:14,lineHeight:1.5,transition:“all .2s”,fontFamily:”‘IBM Plex Sans’,sans-serif”}}><span style={{opacity:.5,marginRight:10}}>{String.fromCharCode(65+i)}.</span>{o}</button>;
})}
{answered&&<div style={{padding:“13px 16px”,background:“rgba(31,111,235,0.07)”,border:“1px solid rgba(56,139,253,0.25)”,borderRadius:8,marginBottom:16}}><div style={{fontSize:12,color:”#58a6ff”,fontWeight:700,marginBottom:4}}>{correct?“✓ Correct!”:“✗ Incorrect — Explanation:”}</div><div style={{fontSize:13,color:”#8b949e”,lineHeight:1.6}}>{q.exp}</div></div>}
<div style={{display:“flex”,justifyContent:“space-between”,gap:8}}>
<button onClick={()=>setCur(Math.max(0,cur-1))} disabled={cur===0} style={{padding:“10px 20px”,background:”#21262d”,border:“1px solid #30363d”,borderRadius:8,color:”#8b949e”,cursor:“pointer”,fontSize:13,opacity:cur===0?.4:1}}>← Back</button>
{cur<questions.length-1
?<button onClick={()=>setCur(cur+1)} style={{padding:“10px 22px”,background:”#1f6feb”,border:“none”,borderRadius:8,color:”#fff”,fontWeight:700,cursor:“pointer”,fontSize:13}}>Next →</button>
:<button onClick={()=>setDone(true)} style={{padding:“10px 22px”,background:”#238636”,border:“none”,borderRadius:8,color:”#fff”,fontWeight:700,cursor:“pointer”,fontSize:13}}>Submit & Grade →</button>
}
</div>
</div>
);
}

// ─── VLSM CALCULATOR ───────────────────────────────────────
function vlsm(network,subnets){
const[baseIP]=network.split(”/”);
const n2i=ip=>ip.split(”.”).reduce((a,o)=>(a<<8)+parseInt(o),0)>>>0;
const i2n=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join(”.”);
const sorted=[…subnets].sort((a,b)=>b.hosts-a.hosts);
let cur=n2i(baseIP);

“show version”:{out:“Cisco IOS Software, Version 15.7(3)M4a\nUptime: 2 days, 14 hours\nCisco 2901 — 2 GigabitEthernet interfaces”},
“show running-config”:{out:“Building configuration…\n!\nhostname Router\n!\ninterface GigabitEthernet0/0\n ip address 192.168.1.1 255.255.255.0\n no shutdown\n!\ninterface GigabitEthernet0/1\n ip address 10.0.0.1 255.255.255.0\n no shutdown\n!\nip route 0.0.0.0 0.0.0.0 10.0.0.254\n!\nend”},

end:{out:””,newPrompt:“Router#”},
exit:{out:””,newPrompt:“Router>”},
};

const QUICK_CMDS=[“help”,“show ip interface brief”,“show ip route”,“show vlan brief”,“show arp”,“ping 8.8.8.8”,“traceroute 8.8.8.8”,“enable”,“configure terminal”];

function RouterCLI(){
const[lines,setLines]=useState([{type:“sys”,text:“Cisco IOS Simulator — NetCertPrep\nType 'help' to see available commands.\n”}]);
const[input,setInput]=useState(””);
const[prompt,setPrompt]=useState(“Router>”);
const[history,setHistory]=useState([]);
const[histIdx,setHistIdx]=useState(-1);
const outputRef=useRef(null);
const inputRef=useRef(null);

useEffect(()=>{
if(outputRef.current) outputRef.current.scrollTop=outputRef.current.scrollHeight;
},[lines]);

const runCommand=(cmd)=>{
const trimmed=cmd.trim();
if(!trimmed)return;
const lower=trimmed.toLowerCase();
setHistory(h=>[trimmed,…h.slice(0,49)]);
setHistIdx(-1);
let out=””, newPrompt=null, shouldClear=false;
if(lower===“clear”){
shouldClear=true;
} else if(lower.startsWith(“ping “)){
const ip=trimmed.split(” “)[1]||”?”;
out=“Type escape sequence to abort.\nSending 5, 100-byte ICMP Echos to “+ip+”:\n!!!!!\nSuccess rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms”;
} else if(lower.startsWith(“traceroute “)){
const ip=trimmed.split(” “)[1]||”?”;
out=“Type escape sequence to abort.\nTracing the route to “+ip+”:\n  1  192.168.1.254    1 msec\n  2  10.0.0.254       2 msec\n  3  “+ip+”   4 msec”;
} else if(lower.startsWith(“interface “)){
newPrompt=“Router(config-if)#”;
out=“Entering interface configuration mode for “+trimmed.slice(10);
} else if(lower.startsWith(“vlan “)){
const id=trimmed.split(” “)[1];
out=“VLAN “+id+” added:\n    Name: VLAN”+id;
newPrompt=“Router(config-vlan)#”;
} else if(lower.startsWith(“ip address “)){
out=“IP address configured.”;
} else if(lower===“no shutdown”){
out=”%LINK-5-CHANGED: Interface GigabitEthernet0/0, changed state to up\n%LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up”;
} else if(lower.startsWith(“hostname “)){
const name=trimmed.split(” “)[1];
newPrompt=name+”(config)#”;
out=“Hostname changed to “+name;
} else if(CLI_COMMANDS[lower]){
const r=CLI_COMMANDS[lower];
out=r.out||””;
newPrompt=r.newPrompt||null;
} else {
out=”% Unknown command: '”+trimmed+”'. Type 'help' for available commands.”;
}
if(shouldClear){setLines([]);return;}
setLines(prev=>[…prev,{type:“input”,text:prompt+” “+trimmed},…(out?[{type:“output”,text:out}]:[])]);
if(newPrompt) setPrompt(newPrompt);
};

const handleKey=(e)=>{
if(e.key===“Enter”){e.preventDefault();runCommand(input);setInput(””);}
else if(e.key===“ArrowUp”){e.preventDefault();const ni=Math.min(histIdx+1,history.length-1);setHistIdx(ni);if(history[ni])setInput(history[ni]);}
else if(e.key===“ArrowDown”){e.preventDefault();const ni=Math.max(histIdx-1,-1);setHistIdx(ni);setInput(ni===-1?””:history[ni]||””);}
else if(e.key===“Tab”){e.preventDefault();const m=Object.keys(CLI_COMMANDS).find(k=>k.startsWith(input.toLowerCase()));if(m)setInput(m);}
};

return(
<div style={{display:“flex”,flexDirection:“column”,background:”#0d1117”,borderRadius:10,border:“1px solid #21262d”,overflow:“hidden”,minHeight:420,flex:1}}>
<div style={{display:“flex”,gap:6,padding:“8px 10px”,overflowX:“auto”,borderBottom:“1px solid #21262d”,background:”#161b22”,flexShrink:0,WebkitOverflowScrolling:“touch”}}>
{QUICK_CMDS.map(c=>(
<button key={c} onClick={()=>{runCommand(c);inputRef.current&&inputRef.current.focus();}}
style={{flexShrink:0,padding:“5px 10px”,background:“rgba(56,139,253,0.1)”,border:“1px solid rgba(56,139,253,0.25)”,borderRadius:5,color:”#58a6ff”,fontSize:11,cursor:“pointer”,fontFamily:“IBM Plex Mono,monospace”,whiteSpace:“nowrap”}}>
{c}
</button>
))}
</div>
<div ref={outputRef} style={{flex:1,overflowY:“auto”,padding:“12px 14px”,fontFamily:“IBM Plex Mono,monospace”,fontSize:12,lineHeight:1.7,background:”#010409”,minHeight:200}}>
{lines.map((line,i)=>(
<pre key={i} style={{margin:0,whiteSpace:“pre-wrap”,wordBreak:“break-word”,color:line.type===“input”?”#3fb950”:line.type===“sys”?”#388bfd”:”#8b949e”}}>{line.text}</pre>
))}
</div>
<div style={{flexShrink:0,borderTop:“1px solid #21262d”,background:”#0d1117”,padding:“10px 12px”,display:“flex”,gap:8,alignItems:“center”}}>
<span style={{color:”#3fb950”,fontSize:12,fontFamily:“IBM Plex Mono,monospace”,flexShrink:0,whiteSpace:“nowrap”}}>{prompt}</span>
<input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey}
placeholder=“type command…” autoCapitalize=“none” autoCorrect=“off” autoComplete=“off” spellCheck={false}
style={{flex:1,background:”#161b22”,border:“1px solid #30363d”,borderRadius:6,padding:“8px 10px”,color:”#3fb950”,fontSize:13,fontFamily:“IBM Plex Mono,monospace”,outline:“none”,minWidth:0}}/>
<button onClick={()=>{runCommand(input);setInput(””);inputRef.current&&inputRef.current.focus();}}
style={{flexShrink:0,padding:“8px 16px”,background:”#238636”,border:“none”,borderRadius:6,color:”#fff”,fontWeight:700,fontSize:13,cursor:“pointer”}}>Send</button>
<button onClick={()=>setLines([])}
style={{flexShrink:0,padding:“8px 10px”,background:“rgba(248,81,73,0.1)”,border:“1px solid rgba(248,81,73,0.25)”,borderRadius:6,color:”#f85149”,fontSize:12,cursor:“pointer”}}>✕</button>
</div>
</div>
);
}

// ─── VPC BUILDER ───────────────────────────────────────────
const VPC_PALETTE=[
{type:“igw”,label:“Internet Gateway”,icon:“🌐”,color:”#ff9900”,desc:“Connects VPC to internet”},
{type:“pub”,label:“Public Subnet”,icon:“📦”,color:”#3fb950”,desc:“Route to IGW”},
{type:“priv”,label:“Private Subnet”,icon:“🔒”,color:”#388bfd”,desc:“No direct internet”},
{type:“ec2”,label:“EC2 Instance”,icon:“🖥”,color:”#bc8cff”,desc:“Virtual server”},
{type:“rds”,label:“RDS Database”,icon:“🗄”,color:”#f778ba”,desc:“Managed database”},
{type:“alb”,label:“Load Balancer”,icon:“⚖️”,color:”#d29922”,desc:“Distributes traffic”},
{type:“nat”,label:“NAT Gateway”,icon:“🔄”,color:”#38d3cb”,desc:“Private → internet outbound”},
{type:“sg”,label:“Security Group”,icon:“🛡”,color:”#f85149”,desc:“Instance firewall”},
];
function VPCBuilder(){
const[placed,setPlaced]=useState([]);
const[conns,setConns]=useState([]);
const[linking,setLinking]=useState(null);
const[dragging,setDragging]=useState(null);
const[offset,setOffset]=useState({x:0,y:0});
const[pending,setPending]=useState(null);
const canvasRef=useRef(null);
const nid=useRef(1);
useEffect(()=>{
const mm=e=>{if(dragging===null)return;setPlaced(p=>p.map(i=>i.id===dragging?{…i,x:e.clientX-offset.x,y:e.clientY-offset.y}:i));};
const tm=e=>{if(dragging===null)return;e.preventDefault();const t=e.touches[0];setPlaced(p=>p.map(i=>i.id===dragging?{…i,x:t.clientX-offset.x,y:t.clientY-offset.y}:i));};
const up=()=>setDragging(null);
window.addEventListener(“mousemove”,mm);window.addEventListener(“mouseup”,up);
window.addEventListener(“touchmove”,tm,{passive:false});window.addEventListener(“touchend”,up);
return()=>{window.removeEventListener(“mousemove”,mm);window.removeEventListener(“mouseup”,up);window.removeEventListener(“touchmove”,tm);window.removeEventListener(“touchend”,up);};
},[dragging,offset]);
const drop=e=>{e.preventDefault();if(!pending)return;const r=canvasRef.current.getBoundingClientRect();setPlaced(p=>[…p,{…pending,id:nid.current++,x:e.clientX-r.left-55,y:e.clientY-r.top-35}]);setPending(null);};
const tDrop=e=>{if(!pending)return;const t=e.changedTouches[0],r=canvasRef.current.getBoundingClientRect();const x=t.clientX-r.left-55,y=t.clientY-r.top-35;if(x>0&&y>0)setPlaced(p=>[…p,{…pending,id:nid.current++,x,y}]);setPending(null);};
const link=id=>{if(!linking){setLinking(id);}else if(linking!==id){setConns(c=>[…c,{from:linking,to:id,id:Date.now()}]);setLinking(null);}else{setLinking(null);}};
const remove=id=>{setPlaced(p=>p.filter(i=>i.id!==id));setConns(c=>c.filter(x=>x.from!==id&&x.to!==id));};
const loadTemplate=()=>{
const items=[
{type:“igw”,label:“Internet Gateway”,icon:“🌐”,color:”#ff9900”,x:250,y:20},
{type:“alb”,label:“Load Balancer”,icon:“⚖️”,color:”#d29922”,x:250,y:120},
{type:“pub”,label:“Public Subnet”,icon:“📦”,color:”#3fb950”,x:100,y:220},
{type:“ec2”,label:“EC2 Instance”,icon:“🖥”,color:”#bc8cff”,x:100,y:330},
{type:“nat”,label:“NAT Gateway”,icon:“🔄”,color:”#38d3cb”,x:400,y:220},
{type:“priv”,label:“Private Subnet”,icon:“🔒”,color:”#388bfd”,x:400,y:330},
{type:“rds”,label:“RDS Database”,icon:“🗄”,color:”#f778ba”,x:400,y:440},
];
setPlaced([]);setConns([]);nid.current=1;
const ps=items.map(i=>({…i,id:nid.current++}));
setPlaced(ps);
setConns([
{from:ps[0].id,to:ps[1].id,id:1},{from:ps[1].id,to:ps[2].id,id:2},
{from:ps[2].id,to:ps[3].id,id:3},{from:ps[2].id,to:ps[4].id,id:4},
{from:ps[4].id,to:ps[5].id,id:5},{from:ps[5].id,to:ps[6].id,id:6},
]);
};
return(
<div style={{display:“flex”,flexDirection:“column”,gap:10,height:“100%”}}>
<div style={{display:“flex”,gap:8,overflowX:“auto”,paddingBottom:4,flexShrink:0,WebkitOverflowScrolling:“touch”}}>
{VPC_PALETTE.map(c=>(
<div key={c.type} draggable onDragStart={()=>setPending(c)} onTouchStart={e=>{e.preventDefault();setPending(c);}} style={{flexShrink:0,padding:“8px 12px”,background:`${c.color}12`,border:`1px solid ${c.color}44`,borderRadius:8,cursor:“grab”,display:“flex”,flexDirection:“column”,alignItems:“center”,gap:4,minWidth:80,userSelect:“none”}}>
<span style={{fontSize:20}}>{c.icon}</span>
<span style={{fontSize:10,color:c.color,fontWeight:700,textAlign:“center”,lineHeight:1.2}}>{c.label}</span>
</div>
))}
<div style={{flexShrink:0,display:“flex”,flexDirection:“column”,gap:4,justifyContent:“center”}}>
<button onClick={loadTemplate} style={{padding:“6px 10px”,background:“rgba(255,153,0,0.1)”,border:“1px solid rgba(255,153,0,0.3)”,borderRadius:6,color:”#ff9900”,fontSize:10,cursor:“pointer”}}>Load VPC</button>
<button onClick={()=>{setPlaced([]);setConns([]);}} style={{padding:“6px 10px”,background:“rgba(248,81,73,0.1)”,border:“1px solid rgba(248,81,73,0.2)”,borderRadius:6,color:”#f85149”,fontSize:10,cursor:“pointer”}}>Clear</button>
</div>
</div>
{linking&&<div style={{padding:“6px 12px”,background:“rgba(56,139,253,0.1)”,border:“1px solid rgba(56,139,253,0.3)”,borderRadius:6,fontSize:12,color:”#58a6ff”,flexShrink:0}}>Tap another component to connect — tap same to cancel</div>}
<div ref={canvasRef} onDragOver={e=>e.preventDefault()} onDrop={drop} onTouchEnd={tDrop} style={{flex:1,position:“relative”,background:“rgba(255,255,255,0.01)”,border:“1px dashed #21262d”,borderRadius:12,backgroundImage:“radial-gradient(circle,rgba(255,255,255,0.02) 1px,transparent 1px)”,backgroundSize:“28px 28px”,overflow:“hidden”,minHeight:320,touchAction:“none”}}>
{placed.length===0&&<div style={{position:“absolute”,inset:0,display:“flex”,alignItems:“center”,justifyContent:“center”,flexDirection:“column”,gap:8,color:”#30363d”}}><span style={{fontSize:36}}>🏗</span><span style={{fontSize:13}}>Drag components here to build your VPC</span></div>}

<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="rgba(56,139,253,0.5)"/></marker></defs>
{conns.map(c=>{const f=placed.find(p=>p.id===c.from),t=placed.find(p=>p.id===c.to);if(!f||!t)return null;return<line key={c.id} x1={f.x+55} y1={f.y+35} x2={t.x+55} y2={t.y+35} stroke="rgba(56,139,253,0.35)" strokeWidth="2" strokeDasharray="6,3" markerEnd="url(#arr)"/>;})}
</svg>
{placed.map(item=>(
<div key={item.id} onMouseDown={e=>{e.stopPropagation();setDragging(item.id);setOffset({x:e.clientX-item.x,y:e.clientY-item.y});}} onTouchStart={e=>{e.stopPropagation();const t=e.touches[0];setDragging(item.id);setOffset({x:t.clientX-item.x,y:t.clientY-item.y});}}
style={{position:“absolute”,left:item.x,top:item.y,background:`${item.color}15`,border:`2px solid ${linking===item.id?"#388bfd":item.color}44`,borderRadius:10,padding:“10px 12px”,cursor:“grab”,display:“flex”,flexDirection:“column”,alignItems:“center”,gap:3,minWidth:110,textAlign:“center”,userSelect:“none”,boxShadow:linking===item.id?`0 0 14px ${item.color}44`:“none”,zIndex:10}}>
<span style={{fontSize:20}}>{item.icon}</span>
<div style={{fontSize:10,color:item.color,fontWeight:700}}>{item.label}</div>
<div style={{display:“flex”,gap:4,marginTop:2}}>
<button onMouseDown={e=>e.stopPropagation()} onTouchStart={e=>e.stopPropagation()} onClick={()=>link(item.id)} style={{padding:“2px 7px”,fontSize:9,background:“rgba(56,139,253,0.15)”,border:“1px solid rgba(56,139,253,0.3)”,borderRadius:4,color:”#58a6ff”,cursor:“pointer”}}>link</button>
<button onMouseDown={e=>e.stopPropagation()} onTouchStart={e=>e.stopPropagation()} onClick={()=>remove(item.id)} style={{padding:“2px 7px”,fontSize:9,background:“rgba(248,81,73,0.15)”,border:“1px solid rgba(248,81,73,0.3)”,borderRadius:4,color:”#f85149”,cursor:“pointer”}}>×</button>
</div>
</div>
))}
</div>
</div>
);
}
